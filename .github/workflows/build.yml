name: Build NS Client

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Fabric versions for Minecraft 1.21.11
        run: |
          echo "Checking the loader/yarn/fabric-api builds pinned in gradle.properties"
          echo "against Fabric's own metadata service, and failing fast with a clear"
          echo "message if they've since been superseded (gradle.properties was written"
          echo "without live internet access)."
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          curl -s "https://meta.fabricmc.net/v2/versions/loader/${MC_VERSION}" -o loader.json || true
          curl -s "https://meta.fabricmc.net/v2/versions/yarn/${MC_VERSION}" -o yarn.json || true
          echo "Pinned minecraft_version=${MC_VERSION}"
          echo "--- latest loader builds available ---"
          cat loader.json | head -c 500 || true
          echo ""
          echo "--- latest yarn builds available ---"
          cat yarn.json | head -c 500 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build with Gradle
        run: gradle build --stacktrace

      - name: Locate built jar
        id: locate
        run: |
          JAR_PATH=$(find build/libs -maxdepth 1 -name "NS-Client-*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Found: $JAR_PATH"

      - name: Upload NS-Client artifact
        uses: actions/upload-artifact@v4
        with:
          name: NS-Client
          path: ${{ steps.locate.outputs.jar_path }}
          if-no-files-found: error
